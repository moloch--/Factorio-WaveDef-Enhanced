[wde-setup]
resources=Resources
preset=Preset
wave-defense=Wave Defense defaults
freeplay=Freeplay defaults
custom=Custom
resource=Resource
frequency=Frequency
size=Size
richness=Richness
resource-enabled=Enable this resource. Disabling it keeps its percentage values for later.
percentage-range=__1__–__2__%. Changes are saved immediately. Regenerate the preview using the seed controls above.
percentage-range-auto=__1__–__2__%. Changes are saved immediately. The preview updates automatically about one second after you stop editing.
invalid-range=Enter a number from __1__ to __2__. Decimals are allowed. This edit has not been saved.
starting-area=Starting area
follow-difficulty=Follow difficulty
difficulty-area=Starting area follows the native difficulty. Select Custom to set it from 100% to 300%.
water-amount=Water amount
water-amount-help=Adjust water coverage across the generated map. 100% keeps the original terrain, lower values give more land, and higher values give more water. 0% removes all water, including the island ocean. This is a relative setting, not the percentage of map tiles covered by water. Changes apply when the preview updates.
tree-coverage=Tree coverage
tree-coverage-help=Adjust forest coverage across the generated map. 100% keeps the original forests, lower values give fewer trees, and higher values give more trees. 0% disables trees. This is relative to the scenario's sparse forests, not the percentage of map tiles covered by trees. Changes apply when the preview updates.
cliff-density=Cliff density
cliff-density-help=Adjust how much of each cliff line is filled in. 100% keeps the original cliffs, lower values leave more gaps, and higher values produce more continuous cliffs. 0% disables cliffs. Cliff elevation and spacing stay unchanged. Changes apply when the preview updates.
read-only=Only administrators can change these shared map settings.
invalid-values=An invalid percentage has not been saved. Correct it or discard invalid edits before starting.
discard-invalid=Discard invalid edits
preview-pending=Preview out of date. Press Enter in the seed field above to regenerate with the same seed, or use Shuffle for a new seed. Start is disabled until the preview matches.
preview-auto=Preview updates automatically about one second after you stop editing. Finish or discard invalid edits to continue. Start is disabled until the preview matches.
preview-current=Preview matches the saved resource, starting-area, and terrain settings.
seed-help=Press Enter to regenerate the preview with this seed and the saved settings below. Shuffle generates a new seed.
seed-help-auto=The preview updates about one second after you stop editing this seed. Press Enter to update immediately. Shuffle generates a new seed.
start-ready=Start the round using the current preview.
