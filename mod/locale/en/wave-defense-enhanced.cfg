[mod-name]
wave-defense-enhanced=Wave Defense Enhanced

[mod-description]
wave-defense-enhanced=Configure resources, starting-area size, and water coverage for Wave Defense. The Enhanced scenario automatically updates the preview after you stop editing. Built-in scenario saves retain manual preview updates.

[wave-defense-enhanced]
command-help=Show the resource preset, starting area, water amount, and pending map settings for Wave Defense.
status=Wave Defense Enhanced: seed __1__, starting area __2__%, perimeter __3__ tiles wide before terrain clipping. Resources: __4__.
water-status=Water amount: __1__% of the default setting.
welcome=Wave Defense Enhanced is active. Configure resources, starting area, and water beside the seed in the setup screen. Confirm the seed with Enter or use Shuffle to update the preview. Use /wde-status to check the applied settings.
welcome-auto=Wave Defense Enhanced is active. Configure resources, starting area, and water in the setup screen. The preview updates automatically about one second after you stop editing. Use /wde-status to check the applied settings.
pending=Wave Defense Enhanced settings are pending until the preview updates or the round restarts. The current map has not changed.
not-applied=Wave Defense Enhanced has not configured this battle map. Settings apply when the scenario next generates a preview or restarts the round.
inactive=Wave Defense Enhanced only changes Wave Defense scenarios. This game is unaffected.

