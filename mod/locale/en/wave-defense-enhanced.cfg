[mod-name]
wave-defense-enhanced=Wave Defense Enhanced

[mod-description]
wave-defense-enhanced=Configure resource generation and starting-area size for the built-in Wave Defense scenario. Changes apply to the next native map reroll or round restart.

[wave-defense-enhanced]
command-help=Show the resource preset, starting area, and pending map settings for Wave Defense.
status=Wave Defense Enhanced: seed __1__, starting area __2__%, perimeter __3__ tiles wide before terrain clipping. Resources: __4__.
welcome=Wave Defense Enhanced is active. Configure resources and starting area in Settings > Mod settings > Map. Before starting the round, confirm the seed with Enter or use Shuffle to apply changes. Use /wde-status to check the applied settings.
pending=Wave Defense Enhanced settings are pending. Confirm the seed with Enter or use Shuffle in the Wave Defense preview, or restart the round, to apply them. The current map has not changed.
not-applied=Wave Defense Enhanced has not configured this battle map. Settings apply when the scenario next generates a preview or restarts the round.
inactive=Wave Defense Enhanced only changes the built-in Wave Defense scenario. This game is unaffected.

