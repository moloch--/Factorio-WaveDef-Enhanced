[mod-setting-description]
wde-resource-preset=Wave Defense preserves the scenario's resource multipliers. Freeplay uses 100% frequency, size, and richness. Custom uses the percentage settings below. Resource enabled switches apply to every preset. Applies on the next native map reroll or round restart.
wde-starting-area-mode=Follow difficulty keeps the native starting area: Easy 225%, Normal 175%, Hard 150%. Custom uses the percentage below and lets the native scenario resize its walls, gates, and turrets. Applies on the next native map reroll or round restart.
wde-starting-area-size=Used only with Custom starting area. This is the map-generation starting-area setting, not total map size. The perimeter resizes in chunk-sized steps. Turret spacing and 50 magazines per turret stay unchanged. Range: 100% to 300%. Applies on the next native map reroll or round restart.
wde-iron-ore-enabled=Generate iron ore. Applies to every resource preset on the next native map reroll or round restart. Disabling resources can make the round unwinnable.
wde-iron-ore-frequency=Used only with the Custom resource preset. 100% is the Freeplay baseline; higher values generally produce more deposits. Range: 1% to 600%. Applies on the next native map reroll or round restart.
wde-iron-ore-size=Used only with the Custom resource preset. 100% is the Freeplay baseline; higher values generally produce larger deposits. Range: 1% to 600%. Applies on the next native map reroll or round restart.
wde-iron-ore-richness=Used only with the Custom resource preset. 100% is the Freeplay baseline; higher values increase ore per resource tile. Range: 1% to 600%. Applies on the next native map reroll or round restart.
wde-copper-ore-enabled=Generate copper ore. Applies to every resource preset on the next native map reroll or round restart. Disabling resources can make the round unwinnable.
wde-copper-ore-frequency=Used only with the Custom resource preset. 100% is the Freeplay baseline; higher values generally produce more deposits. Range: 1% to 600%. Applies on the next native map reroll or round restart.
wde-copper-ore-size=Used only with the Custom resource preset. 100% is the Freeplay baseline; higher values generally produce larger deposits. Range: 1% to 600%. Applies on the next native map reroll or round restart.
wde-copper-ore-richness=Used only with the Custom resource preset. 100% is the Freeplay baseline; higher values increase ore per resource tile. Range: 1% to 600%. Applies on the next native map reroll or round restart.
wde-coal-enabled=Generate coal. Applies to every resource preset on the next native map reroll or round restart. Disabling resources can make the round unwinnable.
wde-coal-frequency=Used only with the Custom resource preset. 100% is the Freeplay baseline; higher values generally produce more deposits. Range: 1% to 600%. Applies on the next native map reroll or round restart.
wde-coal-size=Used only with the Custom resource preset. 100% is the Freeplay baseline; higher values generally produce larger deposits. Range: 1% to 600%. Applies on the next native map reroll or round restart.
wde-coal-richness=Used only with the Custom resource preset. 100% is the Freeplay baseline; higher values increase ore per resource tile. Range: 1% to 600%. Applies on the next native map reroll or round restart.
wde-stone-enabled=Generate stone. Applies to every resource preset on the next native map reroll or round restart. Disabling resources can make the round unwinnable.
wde-stone-frequency=Used only with the Custom resource preset. 100% is the Freeplay baseline; higher values generally produce more deposits. Range: 1% to 600%. Applies on the next native map reroll or round restart.
wde-stone-size=Used only with the Custom resource preset. 100% is the Freeplay baseline; higher values generally produce larger deposits. Range: 1% to 600%. Applies on the next native map reroll or round restart.
wde-stone-richness=Used only with the Custom resource preset. 100% is the Freeplay baseline; higher values increase ore per resource tile. Range: 1% to 600%. Applies on the next native map reroll or round restart.
wde-uranium-ore-enabled=Generate uranium ore. Applies to every resource preset on the next native map reroll or round restart.
wde-uranium-ore-frequency=Used only with the Custom resource preset. 100% is the Freeplay baseline; higher values generally produce more deposits. Range: 1% to 600%. Applies on the next native map reroll or round restart.
wde-uranium-ore-size=Used only with the Custom resource preset. 100% is the Freeplay baseline; higher values generally produce larger deposits. Range: 1% to 600%. Applies on the next native map reroll or round restart.
wde-uranium-ore-richness=Used only with the Custom resource preset. 100% is the Freeplay baseline; higher values increase ore per resource tile. Range: 1% to 600%. Applies on the next native map reroll or round restart.
wde-crude-oil-enabled=Generate crude oil. Applies to every resource preset on the next native map reroll or round restart. Disabling resources can make the round unwinnable.
wde-crude-oil-frequency=Used only with the Custom resource preset. 100% is the Freeplay baseline; higher values generally produce more oil fields. Range: 1% to 600%. Applies on the next native map reroll or round restart.
wde-crude-oil-size=Used only with the Custom resource preset. 100% is the Freeplay baseline; controls oil field size rather than ore-patch area. Range: 1% to 600%. Applies on the next native map reroll or round restart.
wde-crude-oil-richness=Used only with the Custom resource preset. 100% is the Freeplay baseline; higher values increase oil yield. Range: 1% to 600%. Applies on the next native map reroll or round restart.

